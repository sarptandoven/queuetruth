# Read the Docs build of the queuetruth docs site (https://docs.readthedocs.com/platform/stable/config-file/v2.html).
# Read the Docs builds on its own servers when the project is imported there; nothing here runs GitHub Actions.
#
# The site is plain mkdocs-material: the reference pages under docs/reference/ are generated and committed
# (docs/gen_reference.py), so the build needs neither Rust nor the compiled extension. Every Python package is pinned
# to the version in uv.lock: uv exports the lock as a constraints file and installs only mkdocs-material and its
# dependencies under it, so Read the Docs builds with the same versions as `make docs-build`.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    install:
      - python -m pip install "uv==0.11.31"
      - python -m uv export --frozen --all-groups --no-hashes --no-emit-project --quiet --output-file "$READTHEDOCS_VIRTUALENV_PATH/constraints.txt"
      - python -m uv pip install --python "$READTHEDOCS_VIRTUALENV_PATH/bin/python" --constraints "$READTHEDOCS_VIRTUALENV_PATH/constraints.txt" mkdocs-material
    pre_build:
      # Links, anchors, dash style and the nav (the runnable blocks need the compiled extension and run in `make check-docs`).
      - python docs/check_docs.py --no-run
      # The README and docs chart must match the published table it is drawn from.
      - python docs/assets/readme_chart.py --self-test
      - python docs/assets/readme_chart.py --check

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true
