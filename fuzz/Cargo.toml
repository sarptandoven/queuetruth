[package]
name = "queuetruth-fuzz"
description = "cargo-fuzz targets for the untrusted-input parsers of queuetruth (ITCH, IEX DEEP+, DBN, etcsv, Parquet, crypto JSON / CSV)."
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[lib]
name = "qt_fuzz"
path = "src/lib.rs"

# Exact pins as in the main workspace (every release dated on or before 2026-10-16).
[dependencies]
libfuzzer-sys = "=0.4.13"
queuetruth-types = { path = "../crates/types" }
queuetruth-schema = { path = "../crates/schema" }
queuetruth-ingest = { path = "../crates/ingest" }
queuetruth-crypto = { path = "../crates/crypto" }
dbn = "=0.71.0"
flate2 = "=1.1.10"
indexmap = { version = "=2.14.2", features = ["serde"] }
serde_json = { version = "=1.0.151", features = ["preserve_order", "float_roundtrip"] }
# As resolved for `dbn` 0.71.0 (already in the lock tree): `dbn_known_metadata_panic` peeks at zstd preludes.
zstd = "=0.14.3"

# Standalone workspace: the fuzz crate is not a member of the queuetruth workspace (it needs nightly and links
# libFuzzer), so `cargo test --workspace` at the repository root never builds it.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "itch"
path = "fuzz_targets/itch.rs"
test = false
doc = false
bench = false

[[bin]]
name = "itch_parse"
path = "fuzz_targets/itch_parse.rs"
test = false
doc = false
bench = false

