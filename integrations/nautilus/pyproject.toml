[build-system]
requires = ["hatchling>=1.26.3"]  # PEP 639 `license-files` array: older hatchling rejects it
build-backend = "hatchling.build"

[project]
name = "queuetruth-nautilus"
version = "0.1.0"
description = "Calibrated NautilusTrader fill models from queuetruth's exact order-book replay"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Sarp Tandoven" }]
keywords = ["nautilus_trader", "backtesting", "fill model", "order book", "market microstructure", "queuetruth"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
  "Typing :: Typed",
]
# nautilus_trader is LGPL-3.0; this package only imports its public Python API.
dependencies = ["nautilus_trader>=1.231.0,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/sarptandoven/queuetruth"
Documentation = "https://github.com/sarptandoven/queuetruth/tree/main/integrations/nautilus"

[project.scripts]
queuetruth-nautilus = "queuetruth_nautilus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/queuetruth_nautilus"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "UPSTREAM.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["queuetruth_nautilus"]
