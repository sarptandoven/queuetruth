[workspace]
resolver = "3"
members = [
    "crates/types",
    "crates/schema",
    "crates/book",
    "crates/replay",
    "crates/ingest",
    "crates/crypto",
    "crates/l2",
    "crates/zoo",
    "crates/calib",
    "crates/features",
    "crates/testkit",
    "crates/cli",
    "crates/py",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Sarp Tandoven"]
rust-version = "1.85"
repository = "https://github.com/sarptandoven/queuetruth"
publish = false

[workspace.dependencies]
# Internal crates (edges fixed by SPEC section 2).
queuetruth-types = { path = "crates/types", version = "0.2.0" }
queuetruth-schema = { path = "crates/schema", version = "0.2.0" }
queuetruth-book = { path = "crates/book", version = "0.2.0" }
queuetruth-replay = { path = "crates/replay", version = "0.2.0" }
queuetruth-ingest = { path = "crates/ingest", version = "0.2.0" }
queuetruth-crypto = { path = "crates/crypto", version = "0.2.0" }
queuetruth-l2 = { path = "crates/l2", version = "0.2.0" }
queuetruth-zoo = { path = "crates/zoo", version = "0.2.0" }
queuetruth-calib = { path = "crates/calib", version = "0.2.0" }
queuetruth-features = { path = "crates/features", version = "0.2.0" }
queuetruth-testkit = { path = "crates/testkit", version = "0.2.0" }
queuetruth-cli = { path = "crates/cli", version = "0.2.0" }

# External crates: exact pins, every release dated on or before 2026-10-04.
arrow-array = "=59.3.0"
arrow-schema = "=59.3.0"
arrow-buffer = "=59.3.0"
arrow-data = "=59.3.0"
parquet = { version = "=59.3.0", default-features = false, features = ["arrow", "zstd", "snap"] }
pyo3 = { version = "=0.29.3", features = ["abi3-py311"] }
pyo3-arrow = "=0.19.0"
dbn = "=0.71.0"
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order", "float_roundtrip"] }
thiserror = "=2.0.21"
flate2 = "=1.1.10"
csv = "=1.4.0"
sha2 = "=0.10.9"
hex = "=0.4.3"
indexmap = { version = "=2.14.2", features = ["serde"] }
proptest = "=1.11.0"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = false

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
