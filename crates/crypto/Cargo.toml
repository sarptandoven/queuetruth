[package]
name = "queuetruth-crypto"
description = "Crypto order-level capture converters (Bitstamp, Bitfinex, Coinbase full and level3, Kraken L3, Hyperliquid node) and Tardis L2 CSV ingest."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "qt_crypto"
path = "src/lib.rs"

[features]
# Runs the gate tests: cross-crate end-to-end tests that are ignored by default.
gate = []

[dependencies]
queuetruth-types.workspace = true
queuetruth-schema.workspace = true
queuetruth-ingest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
arrow-buffer.workspace = true
arrow-data.workspace = true
parquet.workspace = true
flate2.workspace = true
csv.workspace = true
sha2.workspace = true
hex.workspace = true
indexmap.workspace = true

[dev-dependencies]
proptest.workspace = true
