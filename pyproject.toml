[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "queuetruth"
version = "0.2.0"
description = "Fill-realism and queue-truth kit: exact order-level replay, an L2 queue-model zoo measured against exact truth, calibration, a learned fill model and a sim-vs-live scorer."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Sarp Tandoven" }]
keywords = [
    "backtesting", "market-microstructure", "order-book", "queue-position", "fill-model", "hftbacktest",
    "nautilustrader", "mbo", "itch", "trading",
]
license-files = ["LICENSE", "NOTICE", "third_party/licenses/*"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "pyarrow>=21,<27",
    "numpy>=2.1,<3",
    "scipy>=1.14,<2",
    "scikit-learn>=1.6,<2",
    "pydantic>=2.10,<3",
]

[project.urls]
Homepage = "https://github.com/sarptandoven/queuetruth"
Repository = "https://github.com/sarptandoven/queuetruth"
Documentation = "https://github.com/sarptandoven/queuetruth/tree/main/docs"
Issues = "https://github.com/sarptandoven/queuetruth/issues"
Changelog = "https://github.com/sarptandoven/queuetruth/blob/main/CHANGELOG.md"

[project.optional-dependencies]
client = ["httpx>=0.27,<1"]
mcp = ["mcp>=2.2,<3", "httpx>=0.27,<1"]
polars = ["polars>=1.30,<3"]

[project.scripts]
queuetruth = "queuetruth.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.12",
    "maturin>=1.14,<2",
    "statsmodels>=0.14",
    "lifelines>=0.30",
    "pandas>=2.2",
    "jsonschema>=4.23",
    "pytest-asyncio>=0.24",
    "moto[server]>=5",
    "schemathesis>=4",
    "mkdocs-material>=9.5,<10",
]

[tool.maturin]
manifest-path = "crates/py/Cargo.toml"
python-source = "python"
module-name = "queuetruth._core"
features = ["extension-module"]
include = [
    { path = "LICENSE", format = "sdist" },
    { path = "NOTICE", format = "sdist" },
    # crates/cli/build.rs embeds these; a wheel built from the sdist needs them
    { path = "schemas/json/*.schema.json", format = "sdist" },
]

[tool.uv]
# Every resolved release is at least two weeks old (supply-chain policy).
exclude-newer = "2026-10-04T00:00:00Z"
# Exceptions for security fixes only, each tied to the advisories it closes (pip-audit, 2026-10-23):
# pillow 13.0.0 (35 GHSA advisories in 12.3.0; dev-only via lifelines -> matplotlib), certifi 2026.10.19
# (PYSEC-2026-4320), opentelemetry-api 1.45.1 (GHSA-xcq7-p3pf-p88h), setuptools 84.1.0 (GHSA-xmj3-9gf7-h52w; dev-only
# via moto[server]); pip-audit, 2026-10-31: joserfc 1.7.6 (GHSA-9pg5-8c7x-5hfx; dev-only via moto[server]). Remove
# each once the global cutoff passes it.
exclude-newer-package = { pillow = "2026-10-21T00:00:00Z", certifi = "2026-10-21T00:00:00Z", opentelemetry-api = "2026-10-21T00:00:00Z", setuptools = "2026-10-21T00:00:00Z", joserfc = "2026-10-19T00:00:00Z" }
package = true

[tool.uv.workspace]
members = ["service"]

[tool.uv.sources]
queuetruth = { workspace = true }

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "python/tests",
    "service/tests",
    "tests/e2e",
    "tools/livefill/tests",
    "scripts/nightly/tests",
    "scripts/scale/tests",
    "integrations/hftbacktest/tests",
]
addopts = "-q -m 'not integration' --import-mode=importlib"
pythonpath = ["python", "python/tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "requires_core: needs the compiled queuetruth._core extension (make develop)",
    "requires_postgres: needs PostgreSQL binaries (QT_PG_BIN) or QT_PG_DSN",
    "requires_docker: needs a running Docker daemon",
    "requires_hftbacktest: needs the separate hftbacktest venv (make hbt-crosscheck)",
    "requires_gray_reference: needs tests/fixtures/reference/gray_cmprsk.json",
    "integration: gate / cross-component test (deselected by default)",
    "realdata: reads real market data under .realdata (never in CI)",
    "fuzz: parser fuzz properties and their regression tests (python/tests/fuzz; QT_FUZZ_PROFILE=deep for long runs)",
]
filterwarnings = ["error::pytest.PytestUnknownMarkWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["target", ".venv", ".scratch", ".realdata"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["queuetruth", "queuetruth_service"]

[tool.ruff.format]
line-ending = "lf"
