# Site configuration for the queuetruth docs (mkdocs-material; Zensical reads it too). MkDocs does not allow the
# config file inside docs_dir, so the root mkdocs.yml inherits this file. Build: make docs-build. The pages are
# plain Markdown that renders on GitHub; docs/check_docs.py checks links, runnable blocks and this nav.
site_name: queuetruth
site_description: Exact order-level replay, L2 queue models measured against exact truth, calibration and a sim-vs-live scorer.
docs_dir: docs
strict: true
exclude_docs: |
  launch/
  mkdocs.yml
  check_docs.py
  gen_reference.py
  gen_validated.py
  validated.toml
  assets/*.py
# Pages built and searchable but kept out of the user navigation; they are linked from the pages that need them.
not_in_nav: |
  design/extensions/*.md
  concepts/queue-ahead.md
  concepts/learned-model.md
  concepts/conformal-fill-probability.md
  concepts/trial-ledger.md
  concepts/impact-warning.md
  how-to/reconcile-lean.md
theme:
  name: material
  features: [navigation.sections, navigation.top, content.code.copy, search.highlight]
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
markdown_extensions:
  - admonition
  - tables
  - toc: {permalink: true}
  - pymdownx.superfences
  - pymdownx.details
nav:
  - Home: index.md
  - Tutorials:
      - See it in a minute: tutorials/see-it-in-a-minute.md
      - Your first leaderboard: getting-started.md
      - A real day from free IEX data: how-to/iex-public-demo.md
  - Read the atlas: concepts/fill-realism-atlas.md
  # S6 adds how-to/check-my-backtest.md ("Check my backtest") as the first entry of this section.
  - Check my backtester:
      - hftbacktest: how-to/calibrate-hftbacktest.md
      - hftbacktest plugin: how-to/score-and-calibrate-hftbacktest.md
      - NautilusTrader: how-to/score-nautilus-vs-binance.md
      - Freqtrade and Hummingbot: how-to/reconcile-freqtrade-hummingbot.md
      - Backtrader, VectorBT and LEAN: how-to/reconcile-backtrader-vectorbt.md
      - Any simulator against my live fills: how-to/decompose-the-sim-live-gap.md
      - A QuickFIX-driven strategy: how-to/score-quickfix-strategy.md
      - My own simulator (referee in CI): how-to/referee-your-simulator.md
  - Bring your data:
      - Import fills from my venue or broker: how-to/import-live-logs.md
      - Check a feed before you trust it: how-to/check-a-feed.md
      - Databento MBO for CME and Nasdaq: how-to/databento-mbo.md
      - NYSE order-by-order data: how-to/nyse-order-level.md
      - Crypto order-level feeds: how-to/crypto-l3-sources.md
      - Calibrate on an L2-only venue: how-to/calibrate-live-l2-venue.md
