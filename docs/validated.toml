# What is validated: the single source for every "what is validated" table in the docs.
#
# docs/gen_validated.py turns this file into docs/validated.md and the "Status" block of README.md;
# docs/check_docs.py fails when either is stale. Edit this file, then run:
#     uv run --frozen --no-sync python docs/gen_validated.py
#
# status is one of:
#   real_data       checked on real public market data
#   real_library    checked order by order against the real library or a transliteration of its source
#   documented      re-implemented from public documentation; not checked against the original code
#   fixtures_only   tested on fixtures written from public format documents, or on synthetic data, only
#
# Keep each claim to what a named check shows. `short` is the README wording; `detail` and `evidence` are for
# docs/validated.md. Links in `evidence` are relative to docs/.

[[row]]
area = "Nasdaq TotalView-ITCH 5.0: exact book, shadow orders and scorer"
status = "real_data"
short = "Nasdaq TotalView-ITCH: exact book, shadow orders and scorer on 2 public days"
detail = """2 public days (2019-12-30 and 2020-01-30; AAPL, MSFT, SPY, TSLA) read from the raw ITCH bytes: 0 book \
invariant violations over 16,754,562 records and 0 trade-parity mismatches over 633,287 printed executions. An \
independent matching-engine oracle agrees with the exact fill rule on 3,000 of 3,000 shadow orders on both days. \
3,000 real orders per day used as a live log are reproduced exactly by the scorer's exact arm."""
evidence = [
  ["Results", "RESULTS.md#the-headline-number"],
  ["Real-data checks", "testing.md#real-data-checks"],
]

[[row]]
area = "IEX DEEP+: exact book on every atlas day"
status = "real_data"
short = "IEX DEEP+: exact book on 24 public days, in the atlas"
detail = """24 public days replayed by the Fill-Realism Atlas pipeline; the published 20-day window is 2026-10-15 to \
2026-11-11 (265,351 symbol-days, 12,456 symbols). Every symbol-day's replay is checked for the eight book \
invariants, price priority and trade parity, and a symbol-day with any non-zero check is left out of the published \
numbers. On one day (2026-10-09; SPY, AAPL, NVDA, TSLA; 4,435,281 records) all 21,301 displayed executions were also \
at FIFO rank 0 of their price level."""
evidence = [
  ["The Fill-Realism Atlas", "concepts/fill-realism-atlas.md"],
  ["A real day from free IEX data", "how-to/iex-public-demo.md"],
]

[[row]]
area = "Calibration and the learned fill model"
status = "real_data"
short = "Calibration and the learned fill model, scored on a held-out Nasdaq day"
detail = """Fitted on one public Nasdaq day and scored on the other: `p = 0.29` for NautilusTrader's touch model cuts \
the held-out day's 1 s overfill from +2.8 pp to +0.4 pp. Exports refuse a fit that does not beat the library \
default on held-out data."""
evidence = [
  ["Results", "RESULTS.md#the-headline-number"],
  ["Calibration", "concepts/calibration.md"],
]

[[row]]
area = "NautilusTrader fill models"
status = "real_library"
short = "NautilusTrader fill models, against the real engine"
detail = """The faithful `nt_prob_touch`, `nt_queue_l2` and `nt_queue_l2_prob_touch` agree with nautilus_trader \
1.231.0's `BacktestEngine` (fed `OrderBookDelta`s) on 100% of orders at 1 s, 10 s and 60 s on both Nasdaq days and \
the synthetic fixture. On 2.0.0rc7 the touch model fills the same orders and `nt_queue_l2` agrees on 99.60% to 100% \
of orders per day and horizon. Fed `OrderBookDepth10` snapshots, 1.231.0 behaves differently (see Results)."""
evidence = [
  ["NautilusTrader cross-check", "RESULTS.md#nautilustrader-cross-check"],
