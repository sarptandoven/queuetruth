name: Feature request
description: Suggest a new capability or a change to an existing one.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like queuetruth to do. Commands, API calls or output you have in mind help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other tools you tried.
  - type: textarea
    id: evidence
    attributes:
      label: How would we know it works?
      description: Every claim in queuetruth has a test. What test or reference would show this feature is right?
