# The upstream compatibility dashboard (ROADMAP "Upstream compatibility dashboard"). Every day it asks PyPI for the
# newest hftbacktest and NautilusTrader releases (the newest of each major line from the pinned one up, release
# candidates included), runs the nightly runner's engine checks against them and against the pinned versions on the
# synthetic Nasdaq day (scripts/nightly/compat.py), keeps the result (compat-<date>.json) and one log per version as
# assets of the `compat-results` release, and asks atlas.yml to rebuild the Pages site, which renders compat.html
# from every kept result (scripts/nightly/compat_site.py). Actions are pinned by commit SHA (tag in the trailing
# comment).
#
# The check job runs freshly published third-party packages, so it holds a read-only token and no credentials are
# persisted; only the publish job (release assets) and the site job (one workflow dispatch) can write.
name: compat

on:
  schedule:
    - cron: "17 4 * * *" # daily; PyPI releases are picked up within a day
  workflow_dispatch:
    inputs:
      site:
        description: "Rebuild the Pages site afterwards (default branch only)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: compat
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  UV_PYTHON_DOWNLOADS: never
  UV_VERSION: "0.11.31"
  PYTHON_VERSION: "3.13"
  RUST_TOOLCHAIN: "1.97.1"
  COMPAT_RELEASE: compat-results
  COMPAT_KEEP_DAYS: "90"

jobs:
  check:
    if: github.repository == 'sarptandoven/queuetruth'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      date: ${{ steps.run.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: py
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: venv + sync + develop
        run: |
          uv venv --python "${{ steps.py.outputs.python-path }}" .venv
          make sync
          make develop
      - name: find the versions on PyPI
        id: plan
        env:
          PY: ${{ steps.py.outputs.python-path }}
        run: |
          "$PY" scripts/nightly/compat.py plan --out targets.json --py-tag "cp${PYTHON_VERSION//./}" \
            | tee -a "$GITHUB_OUTPUT"
      - name: run the checks
        id: run
        env:
          PY: ${{ steps.py.outputs.python-path }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LOG_BASE: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ env.COMPAT_RELEASE }}
        run: |
          date="$(date -u +%F)"
          "$PY" scripts/nightly/compat.py run --targets targets.json --out .compat --date "$date" \
            --python "$PY" --qt-python "$PWD/.venv/bin/python" --commit "$GITHUB_SHA" --run-url "$RUN_URL" \
            --log-base "$LOG_BASE" --summary "$GITHUB_STEP_SUMMARY"
          echo "date=$date" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compat
          path: .compat/upload
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # the result and the logs are kept as assets of the compat-results release
    outputs:
      uploaded: ${{ steps.upload.outputs.uploaded }}
    env:
      GH_TOKEN: ${{ github.token }}
      DATE: ${{ needs.check.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: py
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compat
          path: .compat/upload
      - name: keep the result and the logs
        id: upload
        run: |
          if ! gh release view "$COMPAT_RELEASE" > /dev/null 2>&1; then
            gh release create "$COMPAT_RELEASE" --prerelease --title "Upstream compatibility results" \
              --notes "Daily results of .github/workflows/compat.yml: compat-<date>.json and one log per version. Synthetic data only."
          fi
          gh release upload "$COMPAT_RELEASE" .compat/upload/* --clobber
          echo "uploaded=true" >> "$GITHUB_OUTPUT"
      - name: drop results older than the window
        env:
          PY: ${{ steps.py.outputs.python-path }}
        run: |
          gh release view "$COMPAT_RELEASE" --json assets --jq '.assets[].name' \
            | "$PY" scripts/nightly/compat.py prune --today "$DATE" --keep-days "$COMPAT_KEEP_DAYS" \
            | while read -r name; do
                echo "deleting $name"
                gh release delete-asset "$COMPAT_RELEASE" "$name" --yes
              done
      - name: render the page (kept as an asset for a preview; the site renders its own)
        env:
          PY: ${{ steps.py.outputs.python-path }}
        run: |
          gh release download "$COMPAT_RELEASE" --pattern 'compat-*.json' --dir .compat/all
          "$PY" scripts/nightly/compat_site.py --results .compat/all --out .compat/compat.html
          gh release upload "$COMPAT_RELEASE" .compat/compat.html --clobber
      - name: verdict (fails when a pinned version did not pass)
        env:
          PY: ${{ steps.py.outputs.python-path }}
        run: |
          "$PY" scripts/nightly/compat.py verdict ".compat/upload/compat-$DATE.json"

  site:
    needs: publish
    if: >-
      ${{ !cancelled() && needs.publish.outputs.uploaded == 'true'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && (github.event_name == 'schedule' || inputs.site) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # dispatches atlas.yml, which owns the Pages site
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: rebuild the Pages site
        run: |
          gh workflow run atlas.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f site_only=true
