# The public Fill-Realism Atlas on IEX DEEP+ (ROADMAP W1). After each US session it runs the day IEX published
# through the scale pipeline (scripts/scale/local_day.py: split, units, reduce), keeps the reduced day as an asset of
# the `atlas-days` release, combines the newest ATLAS_WINDOW days (scripts/scale/atlas.py combine) and publishes the
# site (scripts/scale/atlas_site.py) with GitHub Pages. The site also carries compat.html, the upstream compatibility
# page rendered from the results compat.yml keeps on the `compat-results` release (scripts/nightly/compat_site.py);
# compat.yml dispatches this workflow with site_only after each new result, since a repository has one Pages site.
# Actions are pinned by commit SHA (tag in the trailing comment).
#
# A manual run with venue nasdaq runs one Nasdaq TotalView-ITCH 5.0 sample day from emi.nasdaq.com instead
# (local_day.py --source itch) and keeps it as an asset of its own release, `atlas-days-nasdaq`, created as a draft:
# only people with write access see it until a maintainer publishes it (gh release edit atlas-days-nasdaq
# --draft=false), since docs/data-and-licensing.md does not settle whether its aggregates may be published. A full
# Nasdaq day may not fit one runner, so it runs with a symbol budget: above NASDAQ_BUDGET_CORE_H predicted
# core-hours the day runs the same number of symbols in every liquidity tier, chosen by a hash
# (plan.py --sample-budget-core-h), and the day's manifest and the site say so. The budget, NASDAQ_UNIT_CORE_S and
# NASDAQ_UNIT_MEM_GIB were sized with scripts/scale/runner_budget.py on synthetic ITCH
# (docs/concepts/fill-realism-atlas.md).
#
# The site shows the kept Nasdaq days next to IEX (IEX stays the default page; Nasdaq is under nasdaq/) only when a
# maintainer sets the repository variable ATLAS_NASDAQ_SITE to true or a manual run asks with nasdaq_site (which
# lasts until the next scheduled deploy: set the variable to keep it), and only once the atlas-days-nasdaq release
# is published, so every page's verify link works for its readers. It is off by default, for the same reason.
# The Nasdaq part is best effort: when it cannot be built the IEX site still deploys. Before the first IEX day the
# site is the compatibility page alone, without Nasdaq.
#
# One-time setup by a maintainer: Settings > Pages > Build and deployment > Source: GitHub Actions. Using IEX's data
# means accepting IEX's Historical Data Terms of Use; every page carries IEX's attribution
# (docs/data-and-licensing.md). Pages show aggregates only; no IEX or Nasdaq file or message is republished.
name: atlas

on:
  schedule:
    - cron: "41 10 * * 2-6" # Tue to Sat; IEX publishes the previous session's file in the early UTC morning
  workflow_dispatch:
    inputs:
      date:
        description: "Session date YYYY-MM-DD (empty: the newest day IEX published)"
        required: false
        default: ""
      rebuild:
        description: "Run the day again even when its release (atlas-days, or atlas-days-nasdaq) already has it"
        type: boolean
        default: false
      publish:
        description: "Deploy the site to GitHub Pages"
        type: boolean
        default: true
      site_only:
        description: "Only rebuild the site from the kept days and compatibility results (compat.yml uses this)"
        type: boolean
        default: false
      venue:
        description: "Venue of the day to run: iex, or nasdaq for a TotalView-ITCH sample day (date is then ignored)"
        type: choice
        options: [iex, nasdaq]
        default: iex
      nasdaq_day:
        description: "With venue nasdaq: the sample day on emi.nasdaq.com, MMDDYYYY"
        required: false
        default: "01302020"
      nasdaq_site:
        description: "Show the kept Nasdaq days on the site (off unless this or the ATLAS_NASDAQ_SITE variable is true)"
        type: boolean
        default: false

permissions:
  contents: read

# A group keeps one pending run and a newer one replaces it, so the site-only rebuilds compat.yml dispatches and the
# Nasdaq days get groups of their own and can never drop a pending IEX day; the deploy job's own group orders the
# deployments.
concurrency:
  group: ${{ inputs.site_only && 'atlas-site' || inputs.venue == 'nasdaq' && 'atlas-nasdaq' || 'atlas' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  UV_PYTHON_DOWNLOADS: never
  UV_VERSION: "0.11.31"
  PYTHON_VERSION: "3.13"
  RUST_TOOLCHAIN: "1.97.1"
  ATLAS_RELEASE: atlas-days
  ATLAS_NASDAQ_RELEASE: atlas-days-nasdaq
  ATLAS_WINDOW: "20"
  NASDAQ_BASE: "https://emi.nasdaq.com/ITCH/Nasdaq%20ITCH/"
  # sized with scripts/scale/runner_budget.py: about 10 predicted core-hours of units fit in 3.5 h on 4 cores
  NASDAQ_BUDGET_CORE_H: "10"
  NASDAQ_UNIT_CORE_S: "100"
  NASDAQ_UNIT_MEM_GIB: "3"
  NASDAQ_SITE: ${{ (inputs.nasdaq_site || vars.ATLAS_NASDAQ_SITE == 'true') && 'true' || 'false' }}
  COMPAT_RELEASE: compat-results

jobs:
  build:
    if: github.repository == 'sarptandoven/queuetruth'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write # the reduced day is kept as an asset of the atlas-days (or atlas-days-nasdaq) release
    outputs:
      site: ${{ steps.site.outputs.built }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: find the day
        id: day
        if: ${{ !inputs.site_only }}
        env:
          DATE_INPUT: ${{ inputs.date }}
          VENUE: ${{ inputs.venue || 'iex' }}
          NASDAQ_DAY: ${{ inputs.nasdaq_day }}
        run: |
          if [ "$VENUE" = nasdaq ]; then
            if ! [[ "$NASDAQ_DAY" =~ ^[0-9]{8}$ ]]; then
              echo "::error::nasdaq_day must be MMDDYYYY, got '$NASDAQ_DAY'"
              exit 1
            fi
            date="${NASDAQ_DAY:4:4}-${NASDAQ_DAY:0:2}-${NASDAQ_DAY:2:2}"
            {
              echo "date=$date"
              echo "mmdd=$NASDAQ_DAY"
              echo "url=${NASDAQ_BASE}${NASDAQ_DAY}.NASDAQ_ITCH50.gz"
              echo "venue=nasdaq"
              echo "release=$ATLAS_NASDAQ_RELEASE"
              echo "prefix=nasdaq-"
            } | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          set -o pipefail
          args=()
          if [ -n "$DATE_INPUT" ]; then args=(--date "$DATE_INPUT"); fi
          python3 scripts/scale/iex_latest.py "${args[@]}" | tee -a "$GITHUB_OUTPUT"
          printf 'venue=iex\nrelease=%s\nprefix=\n' "$ATLAS_RELEASE" | tee -a "$GITHUB_OUTPUT"
      - name: already in the atlas?
        id: have
        env:
          DATE: ${{ steps.day.outputs.date }}
          RELEASE: ${{ steps.day.outputs.release }}
          PREFIX: ${{ steps.day.outputs.prefix }}
          REBUILD: ${{ inputs.rebuild }}
          SITE_ONLY: ${{ inputs.site_only }}
        run: |
          if [ "$SITE_ONLY" = true ]; then
            echo "run_day=false" >> "$GITHUB_OUTPUT"
            echo "run_site=true" >> "$GITHUB_OUTPUT"
            echo "site only: no day is run"
            exit 0
          fi
          have=false
          # a failed listing stops the step (assigned first, not tested in an `if`), so it never reads as "not kept"
          kept="$(bash scripts/nightly/release_assets.sh names "$RELEASE")"
          if grep -qxF "${PREFIX}day-$DATE.tar.gz" <<< "$kept"; then
            have=true
          fi
          run_day=true
          if [ "$have" = true ] && [ "$REBUILD" != true ]; then run_day=false; fi
          # a scheduled run with nothing new (a holiday) publishes nothing
          run_site=true
          if [ "$run_day" = false ] && [ "${{ github.event_name }}" = schedule ]; then run_site=false; fi
          echo "run_day=$run_day" >> "$GITHUB_OUTPUT"
          echo "run_site=$run_site" >> "$GITHUB_OUTPUT"
          echo "day $DATE: in $RELEASE: $have; run the day: $run_day; build the site: $run_site"
      # a whole Nasdaq day splits into about 7 GB of buckets: make room before the build fills the disk
      - name: free disk for the Nasdaq buckets
        if: steps.have.outputs.run_day == 'true' && steps.day.outputs.venue == 'nasdaq'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        if: steps.have.outputs.run_site == 'true'
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.have.outputs.run_site == 'true'
        id: py
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.have.outputs.run_site == 'true'
        with:
          version: ${{ env.UV_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.have.outputs.run_site == 'true'
      - name: venv + sync + develop
        if: steps.have.outputs.run_site == 'true'
        run: |
          uv venv --python "${{ steps.py.outputs.python-path }}" .venv
          make sync
          make develop
      # local_day.py lowers --workers to what memory holds per unit: two IEX units of 6 GiB on a 16 GB runner; four
      # Nasdaq units of 3 GiB, which smaller units (--unit-core-s 100) keep within (runner_budget.py). With fewer
      # workers than asked, local_day.py shrinks the Nasdaq sample budget in proportion before planning. The site step
      # combines the kept days, so the single-day combine (about 11 minutes for an IEX day) is skipped.
      - name: run the day (stream, split, units, reduce)
        if: steps.have.outputs.run_day == 'true'
        env:
          DATE: ${{ steps.day.outputs.date }}
          URL: ${{ steps.day.outputs.url }}
          VENUE: ${{ steps.day.outputs.venue }}
          MMDD: ${{ steps.day.outputs.mmdd }}
          PREFIX: ${{ steps.day.outputs.prefix }}
        run: |
          if [ "$VENUE" = nasdaq ]; then
            # the two days itch_subset.py pins are checked against their pinned hashes; another day streams its URL
            url=()
            case "$MMDD" in 12302019 | 01302020) ;; *) url=(--url "$URL") ;; esac
            uv run --frozen --no-sync python scripts/scale/local_day.py --source itch --date "$MMDD" "${url[@]}" \
              --out .atlas/run --workers 4 --threads 1 --min-free-gib 2 --unit-core-s "$NASDAQ_UNIT_CORE_S" \
              --unit-mem-gib "$NASDAQ_UNIT_MEM_GIB" --sample-budget-core-h "$NASDAQ_BUDGET_CORE_H" --no-combine
          else
            uv run --frozen --no-sync python scripts/scale/local_day.py --source iex --date "$DATE" --url "$URL" \
              --out .atlas/run --workers 4 --threads 1 --min-free-gib 2 --no-combine
          fi
          day_dir=".atlas/run/$(date -d "$DATE" +%m%d%Y)"
          tar -C "$day_dir/day" -czf "${PREFIX}day-$DATE.tar.gz" .
          cp "$day_dir/local_day.json" "${PREFIX}local_day-$DATE.json"
      - name: keep the reduced day
        if: steps.have.outputs.run_day == 'true'
        env:
          DATE: ${{ steps.day.outputs.date }}
          VENUE: ${{ steps.day.outputs.venue }}
          RELEASE: ${{ steps.day.outputs.release }}
          PREFIX: ${{ steps.day.outputs.prefix }}
        run: |
          # exists: 0 found (a draft too), 1 missing, 2 the lookup failed (stop rather than create a second draft)
          found=0
          bash scripts/nightly/release_assets.sh exists "$RELEASE" || found=$?
          if [ "$found" -eq 2 ]; then
            echo "::error::could not look up the release $RELEASE"
            exit 1
          fi
          if [ "$found" -eq 1 ]; then
            if [ "$VENUE" = nasdaq ]; then
              # a draft until a maintainer decides to publish Nasdaq-derived aggregates (docs/data-and-licensing.md)
              gh release create "$RELEASE" --draft --prerelease \
                --title "Fill-Realism Atlas: reduced Nasdaq sample days" \
                --notes "Per-day reduced tables of Nasdaq TotalView-ITCH 5.0 sample days from emi.nasdaq.com (.github/workflows/atlas.yml, venue nasdaq). Aggregate statistics only; no Nasdaq file or message (docs/data-and-licensing.md)."
            else
              gh release create "$RELEASE" --prerelease --title "Fill-Realism Atlas: reduced IEX days" \
                --notes "Per-day reduced tables of the public atlas (.github/workflows/atlas.yml). Aggregates of IEX DEEP+ data; IEX's attribution and terms apply (docs/data-and-licensing.md)."
            fi
          fi
          gh release upload "$RELEASE" "${PREFIX}day-$DATE.tar.gz" "${PREFIX}local_day-$DATE.json" --clobber
      - name: combine the newest days and build the site
        id: site
        if: steps.have.outputs.run_site == 'true'
        run: |
          mkdir -p .atlas/site .atlas/compat
          # the upstream compatibility page is best effort: when it cannot be built the atlas still deploys,
          # without the link
          compat=false
          if results="$(bash scripts/nightly/release_assets.sh names "$COMPAT_RELEASE")" \
              && mapfile -t names < <(grep -E '^compat-[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$' <<< "$results" || true) \
              && bash scripts/nightly/release_assets.sh download "$COMPAT_RELEASE" .atlas/compat "${names[@]}" \
              && uv run --frozen --no-sync python scripts/nightly/compat_site.py --results .atlas/compat \
                --out .atlas/site/compat.html --atlas-link; then
            compat=true
          else
            echo "::warning::the upstream compatibility page could not be built; the atlas deploys without it"
            rm -f .atlas/site/compat.html
          fi
          days="$(bash scripts/nightly/release_assets.sh names "$ATLAS_RELEASE")"
          mapfile -t window < <(grep -E '^day-.*\.tar\.gz$' <<< "$days" | sort | tail -n "$ATLAS_WINDOW")
          if [ "${#window[@]}" -eq 0 ]; then
            # before the first IEX day the site is the compatibility page alone
            if [ "$compat" != true ]; then
              echo "::error::no atlas day and no compatibility page: nothing to publish"
              exit 1
            fi
            uv run --frozen --no-sync python scripts/nightly/compat_site.py --results .atlas/compat \
              --out .atlas/site/index.html
            rm -f .atlas/site/compat.html
            echo "built=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash scripts/nightly/release_assets.sh download "$ATLAS_RELEASE" .atlas/dl "${window[@]}"
          args=()
          for name in "${window[@]}"; do
            d=".atlas/days/${name%.tar.gz}"
            mkdir -p "$d" && tar -C "$d" -xzf ".atlas/dl/$name"
            args+=(--day "$d")
          done
          uv run --frozen --no-sync python scripts/scale/atlas.py combine "${args[@]}" --out .atlas/atlas \
            --flag-policy exclude
          # IEX first, so the default page stays IEX; the kept Nasdaq days go to nasdaq/ only when asked
          venues=(--venue iex=.atlas/atlas)
          # best effort, like the compatibility page: a Nasdaq problem never blocks the IEX deploy
          # (set -e does not apply inside a function called as an `if` condition, so every step checks itself)
          nasdaq_atlas() {
            local ndays name d
            # a public page must not send readers to a draft they cannot open: wait until the release is published
            if ! gh api "repos/$GITHUB_REPOSITORY/releases/tags/$ATLAS_NASDAQ_RELEASE" > /dev/null 2>&1; then
              echo "::warning::$ATLAS_NASDAQ_RELEASE is not published (still a draft, or missing)"
              return 1
            fi
            ndays="$(bash scripts/nightly/release_assets.sh names "$ATLAS_NASDAQ_RELEASE")" || return 1
            mapfile -t nwindow < <(grep -E '^nasdaq-day-.*\.tar\.gz$' <<< "$ndays" | sort | tail -n "$ATLAS_WINDOW")
            if [ "${#nwindow[@]}" -eq 0 ]; then
              echo "::warning::no Nasdaq day is kept yet"
              return 1
            fi
            bash scripts/nightly/release_assets.sh download "$ATLAS_NASDAQ_RELEASE" .atlas/dl "${nwindow[@]}" \
              || return 1
            nargs=()
            for name in "${nwindow[@]}"; do
              d=".atlas/nasdaq-days/${name%.tar.gz}"
              mkdir -p "$d" && tar -C "$d" -xzf ".atlas/dl/$name" || return 1
              nargs+=(--day "$d")
            done
            uv run --frozen --no-sync python scripts/scale/atlas.py combine "${nargs[@]}" --out .atlas/atlas-nasdaq \
              --flag-policy exclude || return 1
          }
          if [ "$NASDAQ_SITE" = true ]; then
            if nasdaq_atlas; then
              venues+=(--venue nasdaq=.atlas/atlas-nasdaq)
            else
              echo "::warning::the Nasdaq days could not be combined; the site shows IEX only"
            fi
          fi
          link=()
          if [ "$compat" = true ]; then link=(--compat-link); fi
          # the Nasdaq pages are best effort to the end: when the two-venue build fails, the IEX site is rebuilt alone
          if ! uv run --frozen --no-sync python scripts/scale/atlas_site.py "${venues[@]}" --out .atlas/site \
              "${link[@]}"; then
            if [ "${#venues[@]}" -le 2 ]; then exit 1; fi
            echo "::warning::the site could not be built with the Nasdaq days; the site shows IEX only"
            rm -rf .atlas/site/nasdaq
            uv run --frozen --no-sync python scripts/scale/atlas_site.py --venue iex=.atlas/atlas --out .atlas/site \
              "${link[@]}"
          fi
          echo "built=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.site.outputs.built == 'true'
        with:
          path: .atlas/site

  deploy:
    needs: build
    concurrency:
      group: atlas-pages
      cancel-in-progress: false
    if: needs.build.outputs.site == 'true' && (github.event_name == 'schedule' || inputs.publish)
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
